<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClasSetu</title>
    <meta name="description" content="AI-Powered Tuition & Coaching Institute Management Web Application with automated scheduling, attendance tracking, fee management, and WhatsApp communication." />
    <meta property="og:title" content="ClasSetu" />
    <meta property="og:description" content="AI-Powered Tuition & Coaching Institute Management Web Application with automated scheduling, attendance tracking, fee management, and WhatsApp communication." />
    <script>
      // Gracefully catch and suppress benign WebSocket connection errors in cloud dev environment where HMR is disabled
      window.addEventListener("unhandledrejection", function (event) {
        var msg = (event && event.reason && (event.reason.message || event.reason.toString())) || "";
        if (msg.indexOf("WebSocket") !== -1 || msg.indexOf("websocket") !== -1) {
          event.preventDefault();
        }
      });
      window.addEventListener("error", function (event) {
        var msg = (event && (event.message || "")) || "";
        if (msg.indexOf("WebSocket") !== -1 || msg.indexOf("websocket") !== -1) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
